<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenCat</title>
    <script>
      // Apply the persisted theme before first paint so the window never flashes
      // the wrong palette. Mirrors the logic in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("opencat.theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* first run: keep the default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
