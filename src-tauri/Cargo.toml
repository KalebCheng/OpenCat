[package]
name = "opencat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenCat desktop application (Tauri shell around the OpenCat driver layer)."
default-run = "opencat"

[lib]
name = "opencat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opencat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opencat-core.workspace = true
opencat-driver.workspace = true

tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
csv.workspace = true
thiserror.workspace = true

[features]
# `custom-protocol` is what `tauri build` enables so the frontend is served from
# the embedded asset bundle rather than the dev server.
custom-protocol = ["tauri/custom-protocol"]
