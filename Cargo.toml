[workspace]
resolver = "2"
members = [
    "crates/opencat-core",
    "crates/opencat-driver",
    "src-tauri",
]
default-members = ["crates/opencat-core", "crates/opencat-driver", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["OpenCat Contributors"]
repository = "https://github.com/opencat/opencat"
description = "OpenCat - a modern, cross-platform database client (Navicat-style)"

[workspace.dependencies]
opencat-core = { path = "crates/opencat-core" }
opencat-driver = { path = "crates/opencat-driver" }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- async runtime ---
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# --- db ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "macros",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
    "sqlite",
    "mysql",
    "postgres",
] }

# --- misc ---
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bigdecimal = { version = "0.4", features = ["serde"] }
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
csv = "1.3"
regex = "1"
once_cell = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
