# Dependency updates.
#
# Grouped and weekly so the repository gets a manageable number of pull requests
# rather than one per transitive dependency.

version: 2
updates:
  # --- Rust -----------------------------------------------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # sqlx releases are tied to a specific set of database features and need a
      # deliberate migration, not an automatic bump.
      - dependency-name: "sqlx"
        update-types: ["version-update:semver-major"]
      # aes-gcm 0.11 sits on `aead` 0.6, which removed `OsRng` and
      # `AeadCore::generate_nonce` — the whole random-number surface changed, so
      # this is a migration rather than a version bump. `secrets.rs` only needs a
      # key and a nonce, so the port is small; do it deliberately and then drop
      # this rule. Tracked in the roadmap.
      - dependency-name: "aes-gcm"
        update-types: ["version-update:semver-major"]

  # --- Frontend -------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # React major versions need a deliberate migration pass.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # --- CI -------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
