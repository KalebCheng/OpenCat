name: Release

# Publishing a tag such as `v0.1.0` builds the installers for every supported
# platform and attaches them to a draft GitHub Release.
#
# Pushing to `main` without a tag runs `Bundle` instead, which produces the same
# installers as workflow artifacts without creating a release.

on:
  push:
    tags:
      # Both spellings are accepted: `v0.1.0` and a bare `0.1.0`. A tag that
      # matches neither simply does not release, which is the safe default.
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A tag push uses the pushed tag; a manual run uses the supplied input.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      # `tauri-action` creates the release and uploads assets with this token.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: macos-universal
            platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"

    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the tagged commit rather than the branch tip.
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS build needs both architecture slices.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `tauri-action` runs `beforeBuildCommand` (pnpm build) and then
      # `tauri build`; with a tag it also creates the release and uploads assets.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is optional. Add these repository secrets to enable it;
          # without them the bundles are produced unsigned.
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "OpenCat ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Cross-platform database client for SQLite, MySQL/MariaDB and PostgreSQL.

            Download the installer for your platform:

            | Platform | File |
            |---|---|
            | Windows | `.msi` (Windows Installer) or `.exe` (NSIS setup) |
            | macOS | `.dmg` (universal — Apple silicon and Intel) |
            | Linux | `.AppImage` (portable), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora/RHEL) |

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for what is in this release.
          releaseDraft: true
          # A tag containing a hyphen (v0.2.0-beta.1) is treated as a prerelease.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: opencat-${{ matrix.name }}
          # `cargo metadata` reports the workspace root as the target directory,
          # so bundles land in `<repo>/target`, not `<repo>/src-tauri/target`.
          # Both layouts are listed so a change in either direction still works,
          # and `target/*/release` covers the `--target <triple>` builds.
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 30
