name: Bundle

# Produces installers for Windows, macOS and Linux on every push to the default
# branch, and on demand. Tagged builds that publish a GitHub Release live in
# release.yml.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bundle:
    name: Bundle ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: macos-universal
            platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS build needs both slices present.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `tauri-action` runs `beforeBuildCommand` (pnpm build) itself, then
      # `tauri build` with the arguments below.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: opencat-${{ matrix.name }}
          # `cargo metadata` reports the workspace root as the target directory,
          # so bundles land in `<repo>/target`, not `<repo>/src-tauri/target`.
          # Both layouts are listed so a change in either direction still works,
          # and `target/*/release` covers the `--target <triple>` builds.
          path: |
            target/release/bundle/**
            target/*/release/bundle/**
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 14
